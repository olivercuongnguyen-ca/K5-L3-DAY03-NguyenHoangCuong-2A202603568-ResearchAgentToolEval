<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research Agent</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c1e21;--mut:#6b7280;--acc:#4f46e5;--bd:#e5e7eb;--user:#4f46e5}
@media(prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1e26;--fg:#e8e9ec;--mut:#9aa0ab;--bd:#2a2e39}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--card);display:flex;align-items:center;gap:12px}
header h1{font-size:16px;margin:0}header .meta{color:var(--mut);font-size:12px;flex:1}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer}
#log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:820px;width:100%;margin:0 auto}
.m{padding:10px 14px;border-radius:12px;max-width:85%;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:var(--user);color:#fff}
.a{align-self:flex-start;background:var(--card);border:1px solid var(--bd)}
.a.err{border-color:#dc2626;color:#dc2626}
details{align-self:flex-start;font-size:12px;color:var(--mut);max-width:85%}
details pre{overflow:auto;max-height:240px;background:var(--card);border:1px solid var(--bd);padding:8px;border-radius:8px;margin:4px 0}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--bd);background:var(--card)}
form>div{display:flex;gap:8px;max-width:820px;width:100%;margin:0 auto}
textarea{flex:1;resize:none;font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
#send{background:var(--acc);color:#fff;border:0}
.dots{color:var(--mut)}
</style></head><body>
<header><h1>Research Agent</h1><span class="meta" id="meta"></span><button id="reset">New chat</button></header>
<div id="log"></div>
<form id="f"><div><textarea id="t" rows="2" placeholder="Ask something… (Enter to send, Shift+Enter for newline)" autofocus></textarea><button id="send">Send</button></div></form>
<script>
const log=document.getElementById('log'),t=document.getElementById('t'),f=document.getElementById('f');
const add=(c,x)=>{const d=document.createElement('div');d.className='m '+c;d.textContent=x;log.appendChild(d);log.scrollTop=1e9;return d};
fetch('/api/info').then(r=>r.json()).then(i=>meta.textContent=`${i.provider} · ${i.model} · ${i.version}`);
reset.onclick=async()=>{await fetch('/api/reset',{method:'POST'});log.innerHTML=''};
f.onsubmit=async e=>{e.preventDefault();const msg=t.value.trim();if(!msg)return;t.value='';
 add('u',msg);const w=add('a dots','Thinking…');send.disabled=true;
 try{const r=await(await fetch('/api/chat',{method:'POST',body:JSON.stringify({message:msg})})).json();
  w.remove();
  (r.tools||[]).forEach(x=>{const d=document.createElement('details');const s=document.createElement('summary');s.textContent='🔧 '+x.name+'('+JSON.stringify(x.args)+')';
   const p=document.createElement('pre');p.textContent=JSON.stringify(x.result,null,2);d.append(s,p);log.appendChild(d)});
  add('a'+(r.status==='error'?' err':''),r.text)
 }catch(err){w.remove();add('a err',String(err))}
 send.disabled=false;t.focus()};
t.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();f.requestSubmit()}};
</script></body></html>
