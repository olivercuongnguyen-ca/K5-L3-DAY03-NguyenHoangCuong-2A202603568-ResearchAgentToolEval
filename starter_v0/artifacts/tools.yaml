# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO(student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng khi thiếu thông tin quan trọng (như thiếu tên tài khoản, thiếu URL) HOẶC khi cần xin xác nhận trước khi thực hiện hành động gửi/đăng bài."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Nội dung câu hỏi ngắn gọn gửi cho người dùng."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu phản hồi mong đợi: BẮT BUỘC dùng 'yes_no' khi xin xác nhận gửi/đăng bài (như trước khi dùng send), dùng 'choice' khi có danh sách lựa chọn, mặc định là 'text' cho câu hỏi mở."}
        options: {type: array, default: [], items: {type: string}, description: "Danh sách lựa chọn (nếu response_type là choice)."}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây của một tài khoản Twitter/X cụ thể. Dùng khi người dùng muốn đọc bài/tweet CỦA một người hoặc một tài khoản cụ thể. KHÔNG dùng khi tìm kiếm theo chủ đề chung."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle/username của tài khoản Twitter/X. TUYỆT ĐỐI KHÔNG chứa ký tự '@' (ví dụ: 'sama', 'elonmusk')."}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng cần lấy (mặc định 5)."}
      required: [screenname]

  - name: social_search
    description: "Tìm kiếm bài đăng theo từ khóa hoặc chủ đề trên mạng xã hội Twitter/X. Dùng khi người dùng tìm kiếm xem mọi người đang nói gì về một chủ đề trên mạng xã hội. KHÔNG dùng khi đọc timeline của một người cụ thể."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc chủ đề cần tìm kiếm trên mạng xã hội."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp: dùng 'Top' khi người dùng hỏi bài đăng phổ biến/nổi bật/top nhất; dùng 'Latest' cho bài mới nhất."}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng (mặc định 5)."}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin hoặc tin tức thời sự trên web internet. Dùng khi tìm kiếm thông tin chung hoặc tin tức trên báo chí/web. KHÔNG dùng khi đã có sẵn URL cụ thể (hãy dùng fetch) hoặc tìm trên mạng xã hội (dùng social_search)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm cốt lõi. QUAN TRỌNG: nếu topic='news', query CHỈ chứa thực thể hoặc chủ đề chính (ví dụ: 'AI', 'robotics', 'OpenAI'), TUYỆT ĐỐI KHÔNG chứa các từ thừa như 'news', 'tin tức', 'hôm nay', 'mới nhất' vì đã có tham số topic và timeframe."}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại tìm kiếm: dùng 'news' khi người dùng hỏi tin tức, báo chí, thời sự; dùng 'general' cho tìm kiếm thông tin/khái niệm chung."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian: dùng 'day' cho hôm nay/24h qua, 'week' cho tuần này, 'month' cho tháng này, 'year' cho năm nay."}
        max_results: {type: integer, default: 5, description: "Số lượng kết quả tối đa (mặc định 5)."}
      required: [query]

  - name: fetch
    description: "Lấy nội dung toàn văn từ một địa chỉ URL trang web cụ thể. Dùng khi người dùng đã cung cấp đường link/URL rõ ràng (bắt đầu bằng http:// hoặc https://). KHÔNG dùng để tìm kiếm."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Đường link URL đầy đủ của trang web cần đọc."}
      required: [url]

  - name: format
    description: "Trình bày danh sách dữ liệu/tin tức đã thu thập được thành văn bản markdown có cấu trúc đẹp mắt. Dùng để tổng hợp thành bản tin digest."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item cần định dạng."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn mẫu định dạng"}
        headline: {type: string, default: "", description: "Tiêu đề bản tin"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi văn bản hoặc bản tin lên kênh Telegram bên ngoài. CHỈ ĐƯỢC PHÉP GỌI khi người dùng ĐÃ XÁC NHẬN RÕ RÀNG (confirmed=true). Nếu người dùng chưa xác nhận, TUYỆT ĐỐI KHÔNG gọi tool này mà phải gọi tool clarify với response_type='yes_no' để xin xác nhận."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung văn bản cần gửi đi."}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận từ người dùng. Bắt buộc phải là true mới được gửi."}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- Student Bonus Tools ----------------
  - name: crypto_price
    description: "Tra cứu giá thời gian thực và biến động 24h của đồng tiền mã hóa (Bitcoin, Ethereum, Solana, v.v.). Dùng khi người dùng hỏi về giá coin/crypto hiện tại."
    parameters:
      type: object
      properties:
        symbol: {type: string, default: "", description: "Mã ký hiệu tiền mã hóa (ví dụ: 'BTC', 'ETH', 'SOL')."}
        currency: {type: string, enum: [USD, USDT, VND], default: "USD", description: "Đơn vị tiền tệ hiển thị giá."}
      required: [symbol]

  - name: github_search
    description: "Tìm kiếm các kho lưu trữ (repository) mã nguồn mở trên GitHub. Dùng khi người dùng tìm kiếm dự án, repo mã nguồn trên GitHub theo từ khóa hoặc ngôn ngữ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm repo GitHub."}
        language: {type: string, default: "", description: "Ngôn ngữ lập trình (ví dụ: 'python', 'rust', 'typescript')."}
        sort: {type: string, enum: [stars, updated, forks], default: "stars", description: "Tiêu chí sắp xếp kết quả."}
        limit: {type: integer, default: 5, description: "Số lượng repository cần trả về."}
      required: [query]

  - name: currency_convert
    description: "Quy đổi tỷ giá ngoại tệ quốc tế giữa các loại tiền tệ (USD, VND, EUR, JPY, GBP, CNY). Dùng khi người dùng cần đổi tiền hoặc tính toán giá trị tương đương."
    parameters:
      type: object
      properties:
        amount: {type: number, default: 1.0, description: "Số tiền cần quy đổi."}
        from_currency: {type: string, default: "USD", description: "Mã tiền tệ gốc (ví dụ: 'USD', 'EUR', 'VND')."}
        to_currency: {type: string, default: "VND", description: "Mã tiền tệ đích cần chuyển sang."}
      required: [amount, from_currency, to_currency]
